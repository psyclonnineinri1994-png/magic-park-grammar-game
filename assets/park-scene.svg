<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">Magic park</title>
  <desc id="desc">A colorful park with three trees, two benches, one fountain, four ducks, two children, one dog, a kite, flowers, two bicycles and an ice cream cart.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8fdae5"/><stop offset="1" stop-color="#e8f7e5"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#78c879"/><stop offset="1" stop-color="#3b9c64"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#1c5542" flood-opacity=".22"/></filter>
  </defs>
  <rect width="900" height="720" rx="40" fill="url(#sky)"/>
  <circle cx="742" cy="104" r="58" fill="#ffe28a"/>
  <g fill="#fff" opacity=".85"><ellipse cx="174" cy="105" rx="70" ry="24"/><ellipse cx="225" cy="103" rx="50" ry="19"/><ellipse cx="558" cy="154" rx="64" ry="21"/><ellipse cx="610" cy="152" rx="39" ry="16"/></g>
  <path d="M0 250 Q170 190 330 245 T650 238 T900 220 V720 H0Z" fill="#a6d68a"/>
  <path d="M0 342 Q165 281 340 330 T700 315 T900 300 V720 H0Z" fill="url(#grass)"/>
  <!-- winding path -->
  <path d="M446 720 C430 605 580 590 532 505 C493 437 405 446 436 355 C454 305 498 286 519 260" fill="none" stroke="#efd69f" stroke-width="88" stroke-linecap="round"/>
  <path d="M446 720 C430 605 580 590 532 505 C493 437 405 446 436 355 C454 305 498 286 519 260" fill="none" stroke="#f7e8c5" stroke-width="70" stroke-linecap="round"/>
  <!-- pond -->
  <ellipse cx="680" cy="548" rx="173" ry="86" fill="#4eb7cf" stroke="#c3ebdc" stroke-width="12"/>
  <path d="M551 539 Q590 520 632 540 T716 538 T801 540" fill="none" stroke="#a4e3e9" stroke-width="5" opacity=".8"/>
  <!-- trees 1,2,3 -->
  <g filter="url(#shadow)">
    <g transform="translate(92 226)"><rect x="51" y="102" width="30" height="146" rx="12" fill="#8a593d"/><circle cx="65" cy="72" r="76" fill="#2d8656"/><circle cx="20" cy="91" r="49" fill="#45a86a"/><circle cx="111" cy="88" r="55" fill="#52b873"/></g>
    <g transform="translate(690 217) scale(.88)"><rect x="51" y="102" width="30" height="146" rx="12" fill="#8a593d"/><circle cx="65" cy="72" r="76" fill="#2d8656"/><circle cx="20" cy="91" r="49" fill="#45a86a"/><circle cx="111" cy="88" r="55" fill="#52b873"/></g>
    <g transform="translate(290 205) scale(.72)"><rect x="51" y="102" width="30" height="146" rx="12" fill="#8a593d"/><circle cx="65" cy="72" r="76" fill="#2d8656"/><circle cx="20" cy="91" r="49" fill="#45a86a"/><circle cx="111" cy="88" r="55" fill="#52b873"/></g>
  </g>
  <!-- fountain -->
  <g transform="translate(389 300)" filter="url(#shadow)">
    <ellipse cx="70" cy="92" rx="82" ry="30" fill="#d9eef1" stroke="#456d70" stroke-width="5"/>
    <ellipse cx="70" cy="86" rx="61" ry="18" fill="#56bfd2"/>
    <path d="M70 79V23" stroke="#55797c" stroke-width="12" stroke-linecap="round"/>
    <path d="M70 29C35 38 39 64 23 72M70 29c34 9 30 35 47 43M70 21c-14-20-28-15-32 5M70 21c14-20 28-15 32 5" fill="none" stroke="#81dced" stroke-width="7" stroke-linecap="round"/>
    <circle cx="70" cy="18" r="10" fill="#ffd66f"/>
  </g>
  <!-- benches -->
  <g fill="#bb7146" stroke="#71472f" stroke-width="5" filter="url(#shadow)">
    <g transform="translate(169 475)"><rect width="135" height="25" rx="8"/><rect y="-43" width="135" height="31" rx="8"/><path d="M18 22v45M117 22v45"/></g>
    <g transform="translate(625 364) scale(.86)"><rect width="135" height="25" rx="8"/><rect y="-43" width="135" height="31" rx="8"/><path d="M18 22v45M117 22v45"/></g>
  </g>
  <!-- ice cream cart -->
