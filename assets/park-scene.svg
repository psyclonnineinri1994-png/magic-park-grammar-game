    <g transform="translate(760 468) scale(.58)"><circle cx="0" cy="40" r="29"/><circle cx="92" cy="40" r="29"/><path d="M0 40l36-48 21 48H0l50-25 42 25M36-8h27M50 15l17-33"/></g>
  </g>
  <!-- ducks: 4 -->
  <g fill="#ffe066" stroke="#7b6334" stroke-width="2">
    <g transform="translate(590 535)"><ellipse rx="20" ry="12"/><circle cx="-13" cy="-13" r="10"/><path d="M-23-13l-13 4 13 5" fill="#ff9b4b"/></g>
    <g transform="translate(665 574)"><ellipse rx="20" ry="12"/><circle cx="-13" cy="-13" r="10"/><path d="M-23-13l-13 4 13 5" fill="#ff9b4b"/></g>
    <g transform="translate(726 527)"><ellipse rx="20" ry="12"/><circle cx="-13" cy="-13" r="10"/><path d="M-23-13l-13 4 13 5" fill="#ff9b4b"/></g>
    <g transform="translate(781 568)"><ellipse rx="20" ry="12"/><circle cx="-13" cy="-13" r="10"/><path d="M-23-13l-13 4 13 5" fill="#ff9b4b"/></g>
  </g>
  <!-- kite -->
  <g transform="translate(555 125) rotate(9)" filter="url(#shadow)"><path d="M0 0l43 42L0 87l-43-45Z" fill="#ff7e68" stroke="#fff" stroke-width="5"/><path d="M0 0v87M-43 42h86" stroke="#fff" stroke-width="4"/><path d="M0 87q-35 34-11 62t-18 46" fill="none" stroke="#4b5960" stroke-width="3"/><path d="M-5 121l-16-8 5 19M-9 161l-17-7 7 18" fill="#ffd66f"/></g>
  <!-- flowers -->
  <g stroke="#2b704f" stroke-width="3"><g transform="translate(120 640)"><path d="M0 0v30M30 2v30M59-2v30M88 0v30"/><g fill="#ff7e68"><circle cx="0" cy="0" r="10"/><circle cx="59" cy="-2" r="10"/></g><g fill="#ffd66f"><circle cx="30" cy="2" r="10"/><circle cx="88" cy="0" r="10"/></g></g><g transform="translate(565 675)"><path d="M0 0v24M28 2v24M55-2v24M82 0v24"/><g fill="#f49bd5"><circle cx="0" cy="0" r="9"/><circle cx="55" cy="-2" r="9"/></g><g fill="#fff16f"><circle cx="28" cy="2" r="9"/><circle cx="82" cy="0" r="9"/></g></g></g>
  <!-- birds -->
  <path d="M227 170q16-17 32 0 16-17 32 0M657 105q13-14 26 0 13-14 26 0M340 120q11-12 22 0 11-12 22 0" fill="none" stroke="#2f5b68" stroke-width="5" stroke-linecap="round"/>
  <!-- count labels -->
  <g font-family="sans-serif" font-size="17" font-weight="bold" fill="#173b34">
    <g transform="translate(30 30)"><rect width="214" height="40" rx="20" fill="#fff" opacity=".92"/><text x="107" y="26" text-anchor="middle">Magic Park • Волшебный парк</text></g>
  </g>
</svg>
