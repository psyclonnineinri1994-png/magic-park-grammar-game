  <!-- children -->
  <g filter="url(#shadow)">
    <g transform="translate(335 485)"><circle cx="0" cy="-64" r="18" fill="#8f5c3d"/><circle cx="0" cy="-60" r="14" fill="#e9ae80"/><path d="M-20-45Q0-58 20-45L15 15H-15Z" fill="#ff7e68"/><path d="M-11 14l-8 55M11 14l10 55" stroke="#2d4f66" stroke-width="13" stroke-linecap="round"/><path d="M-17-35l-25 34M17-35l35-22" stroke="#e9ae80" stroke-width="10" stroke-linecap="round"/></g>
    <g transform="translate(575 402) scale(.9)"><circle cx="0" cy="-64" r="18" fill="#4a2e29"/><circle cx="0" cy="-60" r="14" fill="#c98259"/><path d="M-20-45Q0-58 20-45L15 15H-15Z" fill="#8169c9"/><path d="M-11 14l-8 55M11 14l10 55" stroke="#3a5c43" stroke-width="13" stroke-linecap="round"/><path d="M-17-35l-28-14M17-35l27 19" stroke="#c98259" stroke-width="10" stroke-linecap="round"/></g>
  </g>
  <!-- dog -->
  <g transform="translate(315 585)" filter="url(#shadow)"><ellipse cx="0" cy="0" rx="42" ry="27" fill="#d59249"/><circle cx="-34" cy="-20" r="24" fill="#e1a25e"/><path d="M-53-33l-13-26q31 8 30 26M-14-31l13-22q-29 4-30 22" fill="#835334"/><circle cx="-40" cy="-23" r="3"/><path d="M39-8q34-30 39 1" fill="none" stroke="#d59249" stroke-width="10" stroke-linecap="round"/><path d="M-22 17v28M18 17v28" stroke="#a76a38" stroke-width="10" stroke-linecap="round"/></g>
